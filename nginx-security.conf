# ==============================================================================
# PERÚ CONCHUELA — Hardening Nginx (Incluir dentro del bloque server { ... })
# Marcos: SOC 2 | ISO/IEC 27001:2022 | ISO/IEC 27071:2023 | OWASP ASVS L2
# ==============================================================================

server_tokens off;

# Protocolos TLS modernos exclusivamente (ISO/IEC 27071:2023 / ISO 27001 A.8.24)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# Cabeceras HTTP de seguridad
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; media-src 'self'; frame-src https://www.instagram.com https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self \"https://www.instagram.com\" \"https://www.google.com\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Permitir /.well-known/security.txt y bloquear otros archivos ocultos o internos
location ^~ /.well-known/ {
    allow all;
}

location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* ^/(security-audit\.js|SECURITY\.md|nginx-security\.conf|vercel\.json|_headers)$ {
    deny all;
}

